[project]
name = "modular-checkin-platform"
version = "1.1.1"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3.13",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
ignore = []

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "backend/app/contracts.py",
  "backend/app/services/lock_registry.py",
  "backend/app/services/push_outbox.py",
]
